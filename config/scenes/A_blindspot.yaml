scene_block: 대형 덤프트럭 조수석 방향 아래쪽 좁은 공간으로 근로자가 보행하는 줄 모르고 김기사가 우회전을 시작하려는 순간. 높고 넓은
  덤프트럭의 우측 사각지대에 가려 근로자를 보지 못해 덤프트럭 우측 측면에 보행자가 부딪치기 직전의 상황.
solution: 안전관리자가 사이드미러 아래 보조 거울과 사각지대 모니터를 가리키며 "우회전 전에는 반드시 일시 정지하고 우측 사각지대를 거울과
  카메라로 확실히 확인해야 합니다"라고 안내하는 모습.
